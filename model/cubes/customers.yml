# Mirrors dbt model `dim_customers` (repo: interview-data-dbt). One row per customer.
cubes:
  - name: customers
    sql_table: marts.dim_customers
    public: false
    meta:
      dbt_model: dim_customers

    dimensions:
      - name: customer_id
        sql: customer_id
        type: number
        primary_key: true

      - name: country
        sql: country
        type: string

      - name: acquisition_channel
        sql: acquisition_channel
        type: string

      - name: signup_at
        sql: signup_at
        type: time

      - name: first_paid_at
        sql: first_paid_at
        type: time

      - name: is_paying_customer
        sql: is_paying_customer
        type: boolean

    measures:
      - name: customers
        description: "All external customers (signed up, paid or not)."
        type: count

      - name: paying_customers
        description: "Customers with at least one settled first purchase."
        type: count
        filters:
          - sql: "{CUBE}.is_paying_customer"
